[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporalrca-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<21",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "temporalrca-contracts",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aiosqlite>=0.20,<1"]

[project.scripts]
temporalrca-server = "temporalrca_server.main:run"
temporalrca-maintenance = "temporalrca_server.maintenance:run"
temporalrca-export = "temporalrca_server.export:main"

[tool.uv.sources]
temporalrca-contracts = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["temporalrca_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
