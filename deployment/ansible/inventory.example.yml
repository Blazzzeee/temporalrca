all:
  vars:
    ansible_user: ubuntu
    # This must be an address reachable from VM2/VM3; an Ansible inventory
    # alias such as "vm1" is not necessarily resolvable on the remote hosts.
    temporalrca_server_url: http://192.0.2.11:8000
    temporalrca_enrollment_token: replace-with-a-long-random-value
  children:
    central:
      hosts:
        vm1:
          ansible_host: 192.0.2.11
    workers:
      hosts:
        vm2:
          ansible_host: 192.0.2.12
    consumers:
      hosts:
        vm3:
          ansible_host: 192.0.2.13
