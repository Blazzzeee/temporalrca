---
- name: Create the agent account
  ansible.builtin.user:
    name: temporalrca-agent
    system: true
    shell: /usr/sbin/nologin
    groups:
      - systemd-journal
      - docker
    append: true
  notify: Restart temporalrca agent

- name: Copy agent source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent/"
    dest: /opt/temporalrca/agent/
    mode: preserve
  notify: Restart temporalrca agent

- name: Install agent in an isolated environment
  ansible.builtin.pip:
    name: /opt/temporalrca/agent[postgres,redis]
    virtualenv: /opt/temporalrca-agent
    virtualenv_command: python3 -m venv
  notify: Restart temporalrca agent

- name: Create agent configuration directory
  ansible.builtin.file:
    path: /etc/temporalrca-agent
    state: directory
    owner: root
    group: temporalrca-agent
    mode: "0750"

- name: Render agent configuration
  ansible.builtin.template:
    src: agent.toml.j2
    dest: /etc/temporalrca-agent/config.toml
    owner: root
    group: temporalrca-agent
    mode: "0640"
  notify: Restart temporalrca agent

- name: Install hardened agent unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent/systemd/temporalrca-agent.service"
    dest: /etc/systemd/system/temporalrca-agent.service
    mode: "0644"
  notify: Restart temporalrca agent

- name: Enable agent
  ansible.builtin.systemd:
    name: temporalrca-agent
    enabled: true
    state: started
    daemon_reload: true
