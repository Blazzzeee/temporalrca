---
- name: Create worker account
  ansible.builtin.user:
    name: temporalrca-worker
    system: true
    shell: /usr/sbin/nologin

- name: Install worker program
  ansible.builtin.copy:
    src: worker.py
    dest: /opt/temporalrca/worker.py
    mode: "0755"

- name: Install worker template unit
  ansible.builtin.template:
    src: temporalrca-worker@.service.j2
    dest: /etc/systemd/system/temporalrca-worker@.service
    mode: "0644"

- name: Run three workers concurrently
  ansible.builtin.systemd:
    name: "temporalrca-worker@{{ item }}.service"
    enabled: true
    state: restarted
    daemon_reload: true
  loop: [1, 2, 3]

