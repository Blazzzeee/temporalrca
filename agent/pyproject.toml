[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporalrca-agent"
version = "0.1.0"
description = "Lightweight Linux telemetry reporting agent"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
temporalrca-agent = "temporalrca_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/temporalrca_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

